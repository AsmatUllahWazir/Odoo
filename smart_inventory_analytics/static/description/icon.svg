<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e40af"/>
      <stop offset="100%" style="stop-color:#3b82f6"/>
    </linearGradient>
    <linearGradient id="box" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#93c5fd"/>
      <stop offset="100%" style="stop-color:#60a5fa"/>
    </linearGradient>
  </defs>
  <!-- Rounded background -->
  <rect width="128" height="128" rx="28" ry="28" fill="url(#bg)"/>
  <!-- Soft highlight -->
  <circle cx="100" cy="28" r="40" fill="rgba(255,255,255,0.12)"/>
  <!-- Inventory box / crate -->
  <rect x="32" y="48" width="64" height="48" rx="6" fill="url(#box)" stroke="#fff" stroke-width="2.5"/>
  <!-- Box top lid line -->
  <path d="M32 56 L64 42 L96 56" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Vertical divider on box -->
  <line x1="64" y1="56" x2="64" y2="96" stroke="rgba(255,255,255,0.5)" stroke-width="2"/>
  <!-- Chart bars (aging visual) -->
  <rect x="40" y="72" width="8" height="16" rx="2" fill="#fff" opacity="0.95"/>
  <rect x="52" y="66" width="8" height="22" rx="2" fill="#fff" opacity="0.85"/>
  <rect x="68" y="78" width="8" height="10" rx="2" fill="#fca5a5"/>
  <rect x="80" y="70" width="8" height="18" rx="2" fill="#fecaca"/>
  <!-- Small warning dot for dead stock -->
  <circle cx="92" cy="44" r="10" fill="#ef4444"/>
  <text x="92" y="48" text-anchor="middle" font-size="12" font-weight="700" fill="#fff" font-family="Arial,sans-serif">!</text>
</svg>
